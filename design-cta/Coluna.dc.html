<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: transparent; font-family: Archivo, "Helvetica Neue", Helvetica, sans-serif; }
    a { color: #c4432d; text-decoration: none; }
    a:hover { color: #98301e; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.19em; text-transform: uppercase; color: #7d786f; }
    .row { display: flex; align-items: center; gap: 18px; padding: 20px 0; border-top: 1px solid #e2ddd3; color: #151413; }
    .row-label { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
  </style>
</helmet>

<div id="cta-b" style="width: 520px; height: 760px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 46px 44px; background: #f6f4f0; border-radius: 3px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);">

  <div data-anim="text-block" style="display: flex; flex-direction: column; align-items: flex-start; gap: 26px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 11px; height: 11px; background: {{accent}};"></div>
      <div class="eyebrow">Antes de você sair</div>
    </div>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 54px; line-height: 1.02; color: #151413; letter-spacing: -0.01em; text-wrap: pretty;">Três cliques que ajudam muito o canal.</div>
  </div>

  <div data-anim="actions" style="display: flex; flex-direction: column;">

    <div class="row" data-anim="subscribe">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2"></rect>
        <path d="m9 8 6 4-6 4Z"></path>
      </svg>
      <div class="row-label">Inscreva-se no canal</div>
    </div>

    <div class="row" data-anim="bell">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.268 21a2 2 0 0 0 3.464 0"></path>
        <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path>
      </svg>
      <div class="row-label">Ative o sininho</div>
    </div>

    <div class="row" data-anim="like">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 10v12"></path>
        <path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path>
      </svg>
      <div class="row-label">Deixe o like</div>
    </div>

  </div>

  <div data-anim="instagram" style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding-top: 24px; border-top: 3px solid {{accent}};">
    <div class="eyebrow">Me segue no Instagram</div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"></path>
      </svg>
      <div style="font-size: 24px; font-weight: 500; color: #151413; letter-spacing: -0.01em;">@[SEU_INSTAGRAM]</div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c4432d","options":["#c4432d","#151413","#2f6f5e","#b4842f"]},"$preview":{"width":520,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#c4432d' };
  }
}
</script>
</body>
</html>
