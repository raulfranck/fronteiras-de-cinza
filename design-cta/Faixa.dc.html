<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: transparent; font-family: Archivo, "Helvetica Neue", Helvetica, sans-serif; }
    a { color: #e4573d; text-decoration: none; }
    a:hover { color: #f2765f; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.19em; text-transform: uppercase; color: #8d877d; }
    .chip { display: flex; align-items: center; gap: 12px; color: #f6f4f0; }
    .chip-label { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
    .divider { width: 1px; height: 104px; background: #33302c; }
  </style>
</helmet>

<div id="cta-c" style="width: 1400px; height: 240px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; background: #121110; border-radius: 3px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);">

  <div data-anim="text-block" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px;">
    <div class="eyebrow">Curtiu o vídeo?</div>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 48px; line-height: 1; color: #f6f4f0; letter-spacing: -0.01em; white-space: nowrap;">Inscreva-se</div>
    <div style="width: 44px; height: 3px; background: {{accent}};"></div>
  </div>

  <div class="divider"></div>

  <div data-anim="actions" style="display: flex; align-items: center; gap: 40px;">

    <div class="chip" data-anim="subscribe">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2"></rect>
        <path d="m9 8 6 4-6 4Z"></path>
      </svg>
      <div class="chip-label">Inscrever</div>
    </div>

    <div class="chip" data-anim="bell">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.268 21a2 2 0 0 0 3.464 0"></path>
        <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path>
      </svg>
      <div class="chip-label">Sininho</div>
    </div>

    <div class="chip" data-anim="like">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 10v12"></path>
        <path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path>
      </svg>
      <div class="chip-label">Like</div>
    </div>

  </div>

  <div class="divider"></div>

  <div data-anim="instagram" style="display: flex; align-items: center; gap: 12px;">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"></path>
    </svg>
    <div style="font-size: 24px; font-weight: 500; color: #f6f4f0; letter-spacing: -0.01em; white-space: nowrap;">@[SEU_INSTAGRAM]</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#e4573d","options":["#e4573d","#f6f4f0","#4fae94","#d8ab4a"]},"$preview":{"width":1400,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#e4573d' };
  }
}
</script>
</body>
</html>
